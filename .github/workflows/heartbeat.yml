name: heartbeat
on:
  workflow_dispatch:
  schedule:
    # Keeps /api/live warm so it folds the dashboard's rolling window into the
    # archive even when nobody has the page open.
    - cron: '*/10 * * * *'
permissions: {}
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Poll live endpoint
        run: |
          curl -sS --max-time 45 https://brc-gate-watch.vercel.app/api/live \
            -o live.json -w 'HTTP %{http_code} in %{time_total}s\n'
          jq -r '"archive: \(.archiveCount) readings | current: \(.current.minutes) min | health: \(.sourceHealth)"' live.json
